[package]
name = "spin-oci"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
docker_credential = "1"
docker-registry = { version = "0.9", default-features = false }
# Force a TLS feature on docker-registry's reqwest 0.13. Building `-p spin-oci` in
# isolation doesn't pull in `oci-client` (which is what activates `reqwest/native-tls`
# on 0.13 during a workspace build), so without this docker-registry fails to compile
# because items it uses are gated behind reqwest's `__tls` cfg.
reqwest_0_13 = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }
flate2 = { workspace = true }
futures-util = { workspace = true }
itertools = { workspace = true }
# Fork to allow access to the OCI client's token cache.
# We can switch to using upstream if/when the functionality lands (https://github.com/oras-project/rust-oci-client/pull/270)
# or downstream clients relying on this functionality (eg aka and cloud plugins) are refactored to implement it on their side.
oci-client = { git = "https://github.com/vdice/oci-distribution", rev = "f3eb07a85615db3a5fe4358d8b8da51c041a1c02", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spin-common = { path = "../common" }
spin-compose = { path = "../compose" }
spin-loader = { path = "../loader" }
spin-locked-app = { path = "../locked-app" }
tar = "0.4"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { workspace = true }
walkdir = { workspace = true }
wasmparser = { workspace = true }
wat = "1"

[dev-dependencies]
wasm-encoder = { workspace = true }
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }
