[package]
name = "spin-oci"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
docker_credential = "1"
docker-registry = { version = "0.9", default-features = false }
flate2 = { workspace = true }
futures-util = { workspace = true }
itertools = { workspace = true }
oci-client = { git = "https://github.com/vdice/oci-distribution", rev = "f3eb07a85615db3a5fe4358d8b8da51c041a1c02", default-features = false, features = ["native-tls"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spin-common = { path = "../common" }
spin-compose = { path = "../compose" }
spin-loader = { path = "../loader" }
spin-locked-app = { path = "../locked-app" }
tar = "0.4"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { workspace = true }
walkdir = { workspace = true }
wasmparser = { workspace = true }
wat = "1"

[dev-dependencies]
wasm-encoder = { workspace = true }
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = { workspace = true }
